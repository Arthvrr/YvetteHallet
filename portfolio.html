    <style>
        /* CSS POUR LES FILTRES */
        .filters-wrapper {
            background: #fff;
            padding: 25px;
            border-bottom: 1px solid #eee;
            margin-bottom: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: flex-end;
            position: sticky;
            top: 70px; /* Juste en dessous du header */
            z-index: 90;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #999;
            font-weight: 700;
        }

        select {
            padding: 10px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background: #f9f9f9;
            font-family: var(--font-body);
            font-size: 0.9rem;
            min-width: 160px;
            cursor: pointer;
            transition: all 0.2s;
        }

        select:hover { border-color: #ccc; }
        select:focus { outline: none; border-color: var(--accent-color); background: white; }

        .reset-btn {
            background: var(--text-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            height: 40px;
            transition: background 0.3s;
        }

        .reset-btn:hover { background: var(--accent-color); }

        .results-count {
            width: 100%;
            text-align: center;
            font-size: 0.85rem;
            color: #888;
            margin-top: 10px;
        }

        /* Ajustement Grid pour beaucoup d'images */
        .gallery-grid {
            gap: 20px;
            padding: 0 20px 40px;
        }
        
        /* Loading placeholder */
        .card { min-height: 200px; background: #f4f4f4; }
    </style>
</head>

    <script>
        function filterGallery() {
            const style = document.getElementById('style-select').value;
            const year = document.getElementById('year-select').value;
            const shape = document.getElementById('shape-select').value;
            
            const cards = document.getElementsByClassName('card');
            let count = 0;

            for (let i = 0; i < cards.length; i++) {
                let card = cards[i];
                let cardStyle = card.getAttribute('data-style');
                let cardYear = parseInt(card.getAttribute('data-year')) || 0; // 0 si NaN
                let cardShape = card.getAttribute('data-shape');

                // Filtre Style
                let matchStyle = (style === 'all') || (cardStyle === style);
                
                // Filtre Forme
                let matchShape = (shape === 'all') || (cardShape === shape);
                
                // Filtre Année
                let matchYear = false;
                if (year === 'all') {
                    matchYear = true;
                } else if (year.includes('-')) {
                    let [start, end] = year.split('-').map(Number);
                    if (cardYear >= start && cardYear <= end) matchYear = true;
                } else {
                    if (cardYear === parseInt(year)) matchYear = true;
                }

                if (matchStyle && matchYear && matchShape) {
                    card.style.display = 'block';
                    count++;
                } else {
                    card.style.display = 'none';
                }
            }
            document.getElementById('count-display').innerText = count + " œuvre(s) affichée(s)";
        }

        function resetFilters() {
            document.getElementById('style-select').value = 'all';
            document.getElementById('year-select').value = 'all';
            document.getElementById('shape-select').value = 'all';
            filterGallery();
        }

        // Modal Logic
        const modal = document.getElementById('zoom-modal');
        const modalImg = document.getElementById('modal-img');
        const modalTitle = document.getElementById('modal-title');
        const modalTech = document.getElementById('modal-tech');
        const modalYear = document.getElementById('modal-year');

        function openModal(element) {
            const card = element.closest('.card');
            modalImg.src = element.src;
            modalTitle.innerText = card.getAttribute('data-title');
            modalTech.innerText = card.getAttribute('data-tech');
            
            // Gestion affichage année "0" -> "Date inconnue"
            let y = card.getAttribute('data-year');
            modalYear.innerText = (y === "0") ? "Date inconnue" : y;
            
            modal.classList.add('active');
        }

        function hideZoom() {
            modal.classList.remove('active');
            setTimeout(() => { modalImg.src = ""; }, 300);
        }

        // Init
        filterGallery();
    </script>
</body>
</html>
